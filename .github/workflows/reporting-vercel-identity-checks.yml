name: Reporting Vercel identity checks
on:
  pull_request:
    paths:
      - '.github/workflows/reporting-vercel-identity-checks.yml'
      - 'server/middleware/apiKeyAuth.js'
      - 'server/middleware/reportingVercelIdentity*.js'
      - 'server/routes/externalReportingApi.js'
permissions:
  contents: read
jobs:
  reporting-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Verify Vercel reporting authentication
        run: node --test server/middleware/reportingVercelIdentity.test.js
