name: Reporting source checks
on:
  pull_request:
    paths:
      - '.github/workflows/reporting-vercel-identity-checks.yml'
      - '.github/workflows/deploy-digitalocean.yml'
      - 'server/scripts/reporting-source-operator*.mjs'
      - 'server/middleware/apiKeyAuth.js'
      - 'server/middleware/reportingVercelIdentity*.js'
      - 'server/routes/externalReportingApi.js'
      - 'server/routes/deliveries.js'
      - 'server/models/Delivery.js'
      - 'server/models/ReportingOutbox.js'
      - 'server/models/VehicleLocationHistory.js'
      - 'server/services/reportingOutbox*.js'
      - 'server/services/truckoomApiService.js'
      - 'server/services/truckoomLiveData*.js'
      - 'server/services/truckoomVisitSync*.js'
      - 'server/services/vehicleLocationCapture*.js'
      - 'server/services/vehicleLocationView.js'
      - 'server/services/matterDeliveryImportService.js'
      - 'server/services/matterDeliveryInsert*.js'
      - 'server/services/fleetDispatch*.js'
      - 'server/routes/dispatcherFleet*.js'
      - 'client/public/service-worker.js'
      - 'client/src/components/dispatcher/DispatcherFleet.js'
      - 'client/src/pages/DispatcherWorkspace.js'
      - 'client/src/pages/DispatcherWorkspace.test.js'
      - 'server/package*.json'
permissions:
  contents: read
jobs:
  reporting-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fleet_client_changed: ${{ steps.client_files.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Verify Vercel reporting authentication
        run: node --test server/middleware/reportingVercelIdentity.test.js
      - name: Verify protected reporting operator settings and rollback
        run: node --test server/scripts/reporting-source-operator.test.mjs
      - name: Verify signed fleet saves, review receipts and retries
        run: node --test server/services/fleetDispatch.test.js server/services/fleetDispatchWorker.test.js
      - name: Check whether the dispatcher client changed
        id: client_files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -qE '^client/(public/service-worker\.js|src/components/dispatcher/DispatcherFleet\.js|src/pages/DispatcherWorkspace(\.test)?\.js)$' <<< "$files"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  reporting-mongo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install server test dependencies
        working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name reporting-mongo -p 127.0.0.1:27017:27017 mongo:7.0 --bind_ip_all --replSet reporting
          for i in {1..30}; do
            if docker exec reporting-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'; then break; fi
            sleep 2
          done
          docker exec reporting-mongo mongosh --quiet --eval 'quit(rs.initiate({_id:"reporting",members:[{_id:0,host:"127.0.0.1:27017"}]}).ok === 1 ? 0 : 1)'
          for i in {1..30}; do
            if docker exec reporting-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify source writes, rollback, GPS and webhook receipts
        working-directory: server
        env:
          REPORTING_TEST_MONGO_URI: mongodb://127.0.0.1:27017/driver_reports_ci?directConnection=true
        run: node --test services/reportingOutbox.test.js services/reportingOutbox.integration.test.js services/matterDeliveryInsert.test.js services/truckoomVisitSync.test.js services/truckoomLiveData.test.js services/vehicleLocationCapture.test.js
      - name: Verify existing dispatch, delivery ordering and completion fixtures
        working-directory: server
        run: node --test routes/dispatcherAssignment.test.js routes/dispatcherHandovers.test.js services/deliveryOrder.test.js services/deliveryCompletionFailure.test.js
      - name: Verify the current route inventory
        working-directory: server
        run: npm run traceability:check
  dispatcher-client:
    needs: reporting-identity
    if: needs.reporting-identity.outputs.fleet_client_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Verify the dispatcher workspace and build with fleet enabled
        working-directory: client
        env:
          CI: 'false'
          REACT_APP_DISPATCH_FLEET_ENABLED: '1'
        run: |
          npm ci --no-audit --no-fund
          CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/pages/DispatcherWorkspace.test.js
          npm run build
