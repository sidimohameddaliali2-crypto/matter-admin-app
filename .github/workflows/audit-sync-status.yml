name: Audit sync status

on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: Exact currently deployed application commit
        type: string
        required: true

      audit_build_disk_inventory:
        description: Measure audit workspace and package cache sizes only
        type: boolean
        default: false

      audit_build_clear_package_caches:
        description: Clear the owned npm download and frontend compiler caches
        type: boolean
        default: false

      qualify_builder:
        description: Run only the pinned Linux builder qualification
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  status:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed diagnostics
        uses: actions/checkout@v4

      - name: Validate the deployed commit and prepare diagnostics
        id: prepare
        shell: bash
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Use the exact currently deployed application commit."
            exit 1
          fi
          printf 'code=%s\n' "$(base64 -w0 .github/scripts/audit-sync-status.mjs)" >> "$GITHUB_OUTPUT"

      - name: Read production audit sync status
        uses: appleboy/ssh-action@v1.2.0
        env:
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          QUALIFY_BUILDER: ${{ inputs.qualify_builder }}
          BUILDER_QUALIFICATION_BUNDLE: ${{ inputs.qualify_builder && secrets.DRIVER_AUDIT_ONE_OFF_BUILDER_BUNDLE || '' }}
          AUDIT_STATUS_CODE: ${{ steps.prepare.outputs.code }}
          AUDIT_BUILD_DISK_INVENTORY: ${{ inputs.audit_build_disk_inventory }}
          AUDIT_BUILD_CLEAR_PACKAGE_CACHES: ${{ inputs.audit_build_clear_package_caches }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          command_timeout: 2m
          envs: DO_APP_PATH,EXPECTED_DEPLOYED_SHA,AUDIT_STATUS_CODE,QUALIFY_BUILDER,BUILDER_QUALIFICATION_BUNDLE,AUDIT_BUILD_DISK_INVENTORY,AUDIT_BUILD_CLEAR_PACKAGE_CACHES
          script: |
            set -e
            cd -- "$DO_APP_PATH"
            printf '%s' "$AUDIT_STATUS_CODE" | base64 -d | node --input-type=module - --print
