name: Driver Reports worker

on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Rehearse the report slots, qualify the pinned worker, or run the current eligible slot
        type: choice
        default: qualify
        options:
          - rehearse
          - qualify
          - run

permissions:
  contents: read

concurrency:
  group: driver-reports-hosted-worker
  cancel-in-progress: false

jobs:
  rehearsal:
    if: >-
      github.repository == 'sidimohameddaliali2-crypto/matter-admin-app' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'rehearse'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install the locked report dependencies
        run: npm ci --prefix server --omit=dev --ignore-scripts
      - name: Verify the two Dubai slots against isolated evidence
        run: >-
          node --test
          server/scripts/driverAuditHostedWorker.test.js
          server/services/driverAuditDeliveryChanges.test.js
          server/services/driverAuditDeliveryCaseProjection.test.js
          server/services/driverAuditDeliveryView.test.js
          server/services/driverAuditSupabaseReplica.test.js
          server/services/driverAuditSupabaseSync.test.js
          server/services/driverAuditOffHostWorker.test.js
          server/services/driverAuditLightReader.test.js

  worker:
    if: >-
      github.repository == 'sidimohameddaliali2-crypto/matter-admin-app' &&
      github.ref == 'refs/heads/main' &&
      vars.DRIVER_AUDIT_WORKER_RELEASE_SHA != '' &&
      vars.DRIVER_AUDIT_WORKER_BOOTSTRAP_SHA256 != '' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'qualify') ||
      (vars.DRIVER_AUDIT_WORKER_ARMED == '1' &&
      (github.event_name == 'schedule' || inputs.operation == 'run')))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: driver-reports-worker
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.DRIVER_AUDIT_WORKER_RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the pinned worker release is in main
        id: reviewed
        shell: bash
        env:
          DRIVER_AUDIT_WORKER_RELEASE_SHA: ${{ vars.DRIVER_AUDIT_WORKER_RELEASE_SHA }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse --verify HEAD)"
          test "$checked_out" = "$DRIVER_AUDIT_WORKER_RELEASE_SHA"
          git merge-base --is-ancestor "$checked_out" "$GITHUB_SHA"
          printf 'checkout-sha=%s\n' "$checked_out" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Read the original scheduled run time
        id: scheduled-run
        if: github.event_name == 'schedule'
        timeout-minutes: 1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { GITHUB_REPOSITORY: repository, GITHUB_RUN_ID: runId, GITHUB_SHA: head,
            GITHUB_TOKEN: token, GITHUB_OUTPUT: output } = process.env;
          const check = condition => { if (!condition) throw Error('Invalid workflow run metadata'); };
          async function readScheduledRun() {
            check(repository === 'sidimohameddaliali2-crypto/matter-admin-app' && /^[1-9]\d{0,19}$/.test(runId || '')
              && /^[a-f0-9]{40}$/.test(head || '') && token && output);
            const response = await fetch('https://api.github.com/repos/' + repository + '/actions/runs/' + runId, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(10_000),
              headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token,
                'X-GitHub-Api-Version': '2026-03-10' },
            });
            check(response.status === 200);
            const chunks = [];
            let bytes = 0;
            for await (const chunk of response.body) {
              bytes += chunk.byteLength;
              check(bytes <= 256 * 1024);
              chunks.push(chunk);
            }
            const run = JSON.parse(Buffer.concat(chunks, bytes).toString('utf8'));
            const createdAt = typeof run?.created_at === 'string' ? run.created_at.replace(/(\d{2}:\d{2}:\d{2})Z$/, '$1.000Z') : '';
            const time = Date.parse(createdAt);
            check(Number.isSafeInteger(run?.id) && String(run.id) === runId && run.event === 'schedule'
              && run.repository?.full_name?.toLowerCase() === repository && run.head_branch === 'main' && run.head_sha === head
              && Number.isFinite(time) && time <= Date.now() && new Date(time).toISOString() === createdAt);
            appendFileSync(output, 'created-at=' + createdAt + '\n');
          }
          readScheduledRun().catch(() => {
            console.error('The original scheduled workflow run could not be verified.');
            process.exitCode = 1;
          });
          NODE
      - name: Install the locked report dependencies
        run: npm ci --prefix server --omit=dev --ignore-scripts
      - name: Prepare the encrypted archive cache directory
        if: github.event_name == 'schedule' || inputs.operation == 'run'
        shell: bash
        run: mkdir -m 700 -- "$RUNNER_TEMP/driver-report-worker-cache-v1"
      - name: Restore the encrypted archive cache
        if: github.event_name == 'schedule' || inputs.operation == 'run'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/driver-report-worker-cache-v1/archive.aes
          key: driver-report-worker-cache-v1-${{ vars.DRIVER_AUDIT_WORKER_RELEASE_SHA }}-${{ vars.DRIVER_AUDIT_WORKER_BOOTSTRAP_SHA256 }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: driver-report-worker-cache-v1-${{ vars.DRIVER_AUDIT_WORKER_RELEASE_SHA }}-${{ vars.DRIVER_AUDIT_WORKER_BOOTSTRAP_SHA256 }}-
      - name: Run the reviewed report worker
        id: worker
        shell: bash
        env:
          DRIVER_AUDIT_WORKER_RELEASE_SHA: ${{ vars.DRIVER_AUDIT_WORKER_RELEASE_SHA }}
          DRIVER_AUDIT_WORKER_CHECKOUT_SHA: ${{ steps.reviewed.outputs.checkout-sha }}
          DRIVER_AUDIT_WORKER_BOOTSTRAP_SHA256: ${{ vars.DRIVER_AUDIT_WORKER_BOOTSTRAP_SHA256 }}
          DRIVER_AUDIT_WORKER_ARMED: ${{ vars.DRIVER_AUDIT_WORKER_ARMED }}
          DRIVER_AUDIT_WORKER_EVENT_SCHEDULE: ${{ github.event.schedule }}
          DRIVER_AUDIT_WORKER_RUN_CREATED_AT: ${{ steps.scheduled-run.outputs.created-at }}
          DRIVER_AUDIT_WORKER_CACHE_BUNDLE: ${{ runner.temp }}/driver-report-worker-cache-v1/archive.aes
          DRIVER_AUDIT_WORKER_CACHE_KEY: ${{ secrets.DRIVER_AUDIT_WORKER_CACHE_KEY }}
          DRIVER_AUDIT_WORKER_SUPABASE_SECRET: ${{ secrets.DRIVER_AUDIT_WORKER_SUPABASE_SECRET }}
          REPORT_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'qualify' && '1' || '0' }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse --verify HEAD)" = "$DRIVER_AUDIT_WORKER_CHECKOUT_SHA"
          if [ "$REPORT_QUALIFICATION" = '1' ]; then
            node server/scripts/driverAuditHostedWorker.js --qualify
          elif [ "$GITHUB_EVENT_NAME" = 'schedule' ]; then
            node server/scripts/driverAuditHostedWorker.js --scheduled
          else
            node server/scripts/driverAuditHostedWorker.js --once
          fi
      - name: Save the reviewed encrypted archive cache
        if: always() && github.ref == 'refs/heads/main' && steps.worker.outputs.encrypted-cache-ready == '1'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/driver-report-worker-cache-v1/archive.aes
          key: driver-report-worker-cache-v1-${{ vars.DRIVER_AUDIT_WORKER_RELEASE_SHA }}-${{ vars.DRIVER_AUDIT_WORKER_BOOTSTRAP_SHA256 }}-${{ github.run_number }}-${{ github.run_attempt }}
