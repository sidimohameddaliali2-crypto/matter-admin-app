name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        type: choice
        default: deploy
        options:
          - deploy
          - deploy-supabase-reader
          - check-supabase-reader
          - audit-preflight
          - audit-seed-enable
          - audit-sync-start
          - audit-retention-enable
          - audit-rollback
          - audit-builder-upgrade
          - audit-builder-rollback
          - audit-source-check
          - audit-source-qualify
          - audit-source-host-check
          - audit-source-stage
          - audit-source-proof-stage
          - audit-source-start
          - audit-source-pause
          - audit-source-resume
          - audit-source-rollback
          - reporting-readiness
          - reporting-preview-stage
          - reporting-preview-enable
          - reporting-preview-disable
      audit_source_manifest_sha256:
        description: SHA-256 of the reviewed private source runtime manifest
        type: string
      audit_source_bundle_sha256:
        description: SHA-256 of the compressed private source staging bundle
        type: string
      audit_source_proof_sha256:
        description: SHA-256 of the compressed private proof envelope
        type: string
      audit_source_qualification_sha256:
        description: SHA-256 of the saved replay fixture in the private archive
        type: string
      source_node_executable:
        description: Absolute host path of the qualified source Node executable
        type: string
      audit_source_release_file:
        description: Owner-private host path to the source cutover receipt
        type: string
      audit_source_release_sha256:
        description: SHA-256 of the source cutover receipt
        type: string
      audit_builder_from:
        description: SHA-256 of the previously active builder
        type: string
      audit_builder_to:
        description: SHA-256 of the reviewed replacement builder
        type: string
      expected_sha:
        description: Exact deployed application commit for audit and reporting operations
        type: string
      app_reader_previous_sha:
        description: Exact currently deployed app commit for the report-only release
        type: string
      app_reader_head_sha256:
        description: Exact verified Supabase serving-head body SHA-256
        type: string
      app_reader_generation:
        description: Exact verified Supabase report generation
        type: string
      audit_manifest_sha256:
        description: SHA-256 of the approved private audit handoff
        type: string
      audit_capacity_bytes:
        description: Approved MongoDB audit capacity in bytes
        type: string
      staff_verified_generation:
        description: Generation verified by staff before sync
        type: string
      staff_verification_reference:
        description: SHA-256 of the reviewed staff acceptance receipt
        type: string
      audit_gc_restore_receipt_sha256:
        description: SHA-256 of the reviewed private restore and rollback receipt for replica retention
        type: string
      audit_retained_generations:
        description: Current and previous live audit generation SHA-256 values joined by a colon
        type: string
      sync_min_free_memory_bytes:
        description: Minimum free memory from the reviewed isolated sync replay
        type: string
      sync_min_free_disk_bytes:
        description: Minimum free disk from the reviewed isolated sync replay
        type: string
  # Automatic production deployment is paused. Only manual operations run.

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && !startsWith(inputs.operation || '', 'reporting-')
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_PASSPHRASE: ${{ secrets.DO_SSH_PASSPHRASE }}
          MATTER_CS_RUNTIME_B64: ${{ secrets.MATTER_CS_RUNTIME_B64 }}
          MATTER_ACTIVITY_READER_EMAILS: ${{ secrets.MATTER_ACTIVITY_READER_EMAILS }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
        run: |
          set -e
          if [ -z "$DO_HOST" ]; then echo "DO_HOST is missing"; exit 1; fi
          if [ -z "$DO_USER" ]; then echo "DO_USER is missing"; exit 1; fi
          if [ -z "$DO_APP_PATH" ]; then echo "DO_APP_PATH is missing"; exit 1; fi
          if [ -z "$DO_SSH_KEY" ]; then echo "DO_SSH_KEY is missing"; exit 1; fi

      - name: Verify reviewed audit operation inputs
        if: github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy'
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          BUILDER_FROM: ${{ inputs.audit_builder_from }}
          BUILDER_TO: ${{ inputs.audit_builder_to }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUDIT_MANIFEST: ${{ inputs.audit_manifest_sha256 }}
          AUDIT_CAPACITY: ${{ inputs.audit_capacity_bytes }}
          STAFF_GENERATION: ${{ inputs.staff_verified_generation }}
          STAFF_VERIFICATION: ${{ inputs.staff_verification_reference }}
          GC_RESTORE_RECEIPT: ${{ inputs.audit_gc_restore_receipt_sha256 }}
          RETAINED_GENERATIONS: ${{ inputs.audit_retained_generations }}
          SYNC_MEMORY: ${{ inputs.sync_min_free_memory_bytes }}
          SYNC_DISK: ${{ inputs.sync_min_free_disk_bytes }}
          SOURCE_MANIFEST: ${{ inputs.audit_source_manifest_sha256 }}
          SOURCE_RELEASE_FILE: ${{ inputs.audit_source_release_file }}
          SOURCE_RELEASE_SHA: ${{ inputs.audit_source_release_sha256 }}
          SOURCE_NODE: ${{ inputs.source_node_executable }}
          SOURCE_BUNDLE_SHA: ${{ inputs.audit_source_bundle_sha256 }}
          SOURCE_PROOF_SHA: ${{ inputs.audit_source_proof_sha256 }}
          SOURCE_QUALIFICATION_SHA: ${{ inputs.audit_source_qualification_sha256 }}
          REPORTING_SECRET: ${{ inputs.operation != 'audit-rollback' && secrets.DRIVER_AUDIT_SUPABASE_SECRET || '' }}
          READER_PREVIOUS_SHA: ${{ inputs.app_reader_previous_sha }}
          READER_HEAD_SHA: ${{ inputs.app_reader_head_sha256 }}
          READER_GENERATION: ${{ inputs.app_reader_generation }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "The workflow ref must match the exact reviewed commit."
            exit 1
          fi
          if [ -n "$GC_RESTORE_RECEIPT" ] && [ "$OPERATION" != audit-retention-enable ]; then
            echo "Only audit-retention-enable can enable replica reclamation."
            exit 1
          fi
          if [ "$OPERATION" = audit-retention-enable ] && [[ ! "$GC_RESTORE_RECEIPT" =~ ^[a-f0-9]{64}$ || ! "$RETAINED_GENERATIONS" =~ ^[a-f0-9]{64}:[a-f0-9]{64}$ ]]; then
            echo "Reviewed private restore proof and the exact current and previous audit generations are required."
            exit 1
          fi
          case "$OPERATION" in
            deploy-supabase-reader|check-supabase-reader)
              if [[ ! "$READER_PREVIOUS_SHA" =~ ^[a-f0-9]{40}$ || "$READER_PREVIOUS_SHA" = "$GITHUB_SHA" || ! "$READER_HEAD_SHA" =~ ^[a-f0-9]{64}$ || ! "$READER_GENERATION" =~ ^[a-f0-9]{64}$ ]]; then
                echo "The old app and exact verified Supabase report identities are required."
                exit 1
              fi
              exit 0 ;;
            audit-source-host-check) exit 0 ;;
            audit-source-*)
              if [[ ! "$SOURCE_MANIFEST" =~ ^[a-f0-9]{64}$ ]]; then
                echo "The reviewed source manifest is required."
                exit 1
              fi
              if [ "$OPERATION" != audit-source-proof-stage ] && [[ "$SOURCE_NODE" != /* ]]; then
                echo "The qualified source Node executable path is required."
                exit 1
              fi
              if [ "$OPERATION" = audit-source-stage ] && [[ ! "$SOURCE_BUNDLE_SHA" =~ ^[a-f0-9]{64}$ ]]; then
                echo "The private compressed source bundle hash is required."
                exit 1
              fi
              if [ "$OPERATION" = audit-source-proof-stage ] && [[ ! "$SOURCE_PROOF_SHA" =~ ^[a-f0-9]{64}$ ]]; then
                echo "The private proof envelope hash is required."
                exit 1
              fi
              if [ "$OPERATION" = audit-source-qualify ] && [[ ! "$SOURCE_QUALIFICATION_SHA" =~ ^[a-f0-9]{64}$ ]]; then
                echo "The pinned saved replay fixture hash is required."
                exit 1
              fi
              if [ "$OPERATION" = audit-source-start ] && [[ ! "$SOURCE_RELEASE_SHA" =~ ^[a-f0-9]{64}$ || "$SOURCE_RELEASE_FILE" != /* ]]; then
                echo "The private source cutover receipt path and hash are required."
                exit 1
              fi
              exit 0 ;;
            audit-rollback) exit 0 ;;
            audit-builder-upgrade|audit-builder-rollback)
              if [[ ! "$BUILDER_FROM" =~ ^[a-f0-9]{64}$ || ! "$BUILDER_TO" =~ ^[a-f0-9]{64}$ || "$BUILDER_FROM" = "$BUILDER_TO" ]]; then
                echo "The previous and replacement builder hashes are required."
                exit 1
              fi
              exit 0 ;;
            audit-preflight|audit-seed-enable|audit-sync-start|audit-retention-enable) ;;
            *) echo "Invalid audit operation."; exit 1 ;;
          esac
          if [[ ! "$AUDIT_MANIFEST" =~ ^[a-f0-9]{64}$ || ! "$AUDIT_CAPACITY" =~ ^[1-9][0-9]*$ || -z "$REPORTING_SECRET" ]]; then
            echo "The reviewed manifest, capacity, and private reporting credential are required."
            exit 1
          fi
          if [ "$OPERATION" = audit-sync-start ] && [[ ! "$STAFF_GENERATION" =~ ^[a-f0-9]{64}$ || ! "$STAFF_VERIFICATION" =~ ^[a-f0-9]{64}$ || ! "$SYNC_MEMORY" =~ ^[1-9][0-9]*$ || ! "$SYNC_DISK" =~ ^[1-9][0-9]*$ ]]; then
            echo "Reviewed staff evidence and measured sync host requirements are required."
            exit 1
          fi

      - name: Set up website build runtime
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build and seal website away from the live server
        id: website
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
        shell: bash
        env:
          REACT_APP_2GIS_API_KEY: ${{ vars.REACT_APP_2GIS_API_KEY }}
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_SOCKET_URL: ${{ vars.REACT_APP_SOCKET_URL }}
          REACT_APP_LOCAL_TIMEZONE_OFFSET_MINUTES: ${{ vars.REACT_APP_LOCAL_TIMEZONE_OFFSET_MINUTES }}
          REACT_APP_ENABLE_EARLY_NEXT_DAY: ${{ vars.REACT_APP_ENABLE_EARLY_NEXT_DAY }}
          REACT_APP_NEXT_DAY_AVAILABLE_HOUR: ${{ vars.REACT_APP_NEXT_DAY_AVAILABLE_HOUR }}
          REACT_APP_MENU_SELECTION_V2_TOKENS: ${{ vars.REACT_APP_MENU_SELECTION_V2_TOKENS }}
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ vars.REACT_APP_GOOGLE_MAPS_API_KEY }}
          REACT_APP_GOOGLE_GEOCODING_API_KEY: ${{ vars.REACT_APP_GOOGLE_GEOCODING_API_KEY }}
        run: |
          set -euo pipefail
          node --test .github/scripts/website-release.test.mjs .github/scripts/api-handoff.test.mjs
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd client
          npm ci
          PUBLIC_URL="/website-releases/$release_id" npm run build
          cd ..
          node .github/scripts/website-release.mjs seal client/build "$release_id"
          tar -czf website-build.tar.gz -C client/build .
          git archive --format=tar HEAD server .github/scripts | gzip > api-source.tar.gz
          echo "api_sha256=$(sha256sum api-source.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum website-build.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload immutable website candidate
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          source: website-build.tar.gz,api-source.tar.gz
          target: ${{ secrets.DO_APP_PATH }}/.website/incoming/${{ steps.website.outputs.release_id }}

      - name: Hand off the isolated API and publish the verified website
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          ATOMIC_WEBSITE_DEPLOY: ${{ vars.ATOMIC_WEBSITE_DEPLOY || '0' }}
          WEBSITE_RELEASE_ID: ${{ steps.website.outputs.release_id }}
          WEBSITE_ARCHIVE_SHA256: ${{ steps.website.outputs.sha256 }}
          API_ARCHIVE_SHA256: ${{ steps.website.outputs.api_sha256 }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          command_timeout: 30m
          envs: DO_APP_PATH,DEPLOY_SHA,ATOMIC_WEBSITE_DEPLOY,WEBSITE_RELEASE_ID,WEBSITE_ARCHIVE_SHA256,API_ARCHIVE_SHA256
          script: |
            set -eu
            umask 077
            cd -- "$DO_APP_PATH"
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            [ "$(git rev-parse origin/main)" = "$DEPLOY_SHA" ] || { echo 'Main advanced; select its reviewed run'; exit 1; }
            case "$ATOMIC_WEBSITE_DEPLOY" in 0|1) ;; *) exit 1 ;; esac
            case "$WEBSITE_RELEASE_ID" in "$DEPLOY_SHA"-[0-9]*-[0-9]*) ;; *) exit 1 ;; esac
            incoming="$DO_APP_PATH/.website/incoming/$WEBSITE_RELEASE_ID"
            printf '%s  %s\n' "$WEBSITE_ARCHIVE_SHA256" "$incoming/website-build.tar.gz" | sha256sum --check -
            printf '%s  %s\n' "$API_ARCHIVE_SHA256" "$incoming/api-source.tar.gz" | sha256sum --check -
            mkdir "$incoming/build"
            tar -xzf "$incoming/website-build.tar.gz" -C "$incoming/build" --no-same-owner --no-same-permissions
            mkdir -p "$DO_APP_PATH/.api/releases"
            release="$DO_APP_PATH/.api/releases/$WEBSITE_RELEASE_ID"
            mkdir "$release"
            tar -xzf "$incoming/api-source.tar.gz" -C "$release" --no-same-owner --no-same-permissions
            publisher="$release/.github/scripts/website-release.mjs"
            node "$publisher" verify "$incoming/build" "$WEBSITE_RELEASE_ID"
            if [ "$ATOMIC_WEBSITE_DEPLOY" = 1 ]; then
              node "$publisher" check "$DO_APP_PATH/.website/current" https://matterapp.online
            else
              node "$publisher" prepare-live "$DO_APP_PATH" "$incoming/build" "$WEBSITE_RELEASE_ID" https://matterapp.online
            fi
            node "$release/.github/scripts/api-release.mjs" "$DO_APP_PATH" "$WEBSITE_RELEASE_ID" "$incoming/build" "$ATOMIC_WEBSITE_DEPLOY"

      - name: Prepare the reviewed report-only operator
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy-supabase-reader' || inputs.operation == 'check-supabase-reader')
        id: reader
        shell: bash
        env:
          READER_PREVIOUS_SHA: ${{ inputs.app_reader_previous_sha }}
          READER_HEAD_SHA: ${{ inputs.app_reader_head_sha256 }}
          READER_GENERATION: ${{ inputs.app_reader_generation }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),zlib=require('zlib');
          const bytes=fs.readFileSync('.github/scripts/driver-audit-supabase-app-release.mjs');
          if(bytes.length>192*1024)throw Error('The reviewed reader operator exceeds its bound');
          const sha=crypto.createHash('sha256').update(bytes).digest('hex');
          const request={version:1,expectedOldSha:process.env.READER_PREVIOUS_SHA,selectedSha:process.env.GITHUB_SHA,
            reportHeadSha256:process.env.READER_HEAD_SHA,generation:process.env.READER_GENERATION};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'operator='+zlib.gzipSync(bytes).toString('base64')+'\nsha256='+sha+'\nrequest='+Buffer.from(JSON.stringify(request)).toString('base64')+'\n');
          NODE

      - name: Release only the verified Supabase report reader
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy-supabase-reader' || inputs.operation == 'check-supabase-reader')
        uses: appleboy/ssh-action@v1.2.0
        env:
          DRIVER_AUDIT_APP_PATH: ${{ secrets.DO_APP_PATH }}
          READER_OPERATOR_GZIP: ${{ steps.reader.outputs.operator }}
          READER_OPERATOR_SHA: ${{ steps.reader.outputs.sha256 }}
          READER_REQUEST: ${{ steps.reader.outputs.request }}
          READER_APPLY: ${{ inputs.operation == 'deploy-supabase-reader' && '1' || '0' }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          envs: DRIVER_AUDIT_APP_PATH,READER_OPERATOR_GZIP,READER_OPERATOR_SHA,READER_REQUEST,READER_APPLY
          script: |
            set -eu
            if [ -f "$DRIVER_AUDIT_APP_PATH/.api/current.json" ]; then
              echo 'Managed web API is active. The legacy reader operator cannot restart its separate job owner or certify a different serving checkout.'
              exit 1
            fi
            /usr/bin/node --input-type=module <<'NODE'
            import {gunzipSync} from 'node:zlib';import {createHash} from 'node:crypto';
            try {
              const bytes=gunzipSync(Buffer.from(process.env.READER_OPERATOR_GZIP,'base64'),{maxOutputLength:192*1024});
              if(!/^[a-f0-9]{64}$/.test(process.env.READER_OPERATOR_SHA||'')||createHash('sha256').update(bytes).digest('hex')!==process.env.READER_OPERATOR_SHA)throw Error('Operator identity differs');
              const operator=await import('data:text/javascript;base64,'+bytes.toString('base64'));
              const request=operator.validateAppReaderReleaseRequest(JSON.parse(Buffer.from(process.env.READER_REQUEST,'base64')));
              if(!['0','1'].includes(process.env.READER_APPLY||''))throw Error('Invalid reviewed reader operation');
              console.log(JSON.stringify(await operator.releaseSupabaseAppReader({appRoot:process.env.DRIVER_AUDIT_APP_PATH,request,apply:process.env.READER_APPLY==='1'})));
            } catch(error) {
              const budget=error.code==='APP_READER_COLD_BUDGET';
              console.log(JSON.stringify({status:'supabase-app-reader-stopped',reason:budget?'cold-transfer-budget':'private-release-guard',
                ...(budget?{requiredBytes:error.requiredBytes,availableBytes:error.availableBytes}:{})}));
              process.exitCode=1;
            }
            NODE

      - name: Prepare private source transfer
        id: source-transfer
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-source-stage'
        shell: bash
        env:
          SOURCE_BUNDLE_SHA: ${{ inputs.audit_source_bundle_sha256 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_01: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_01 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_02: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_02 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_03: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_03 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_04: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_04 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_05: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_05 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_06: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_06 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_07: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_07 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_08: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_08 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_09: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_09 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_10: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_10 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_11: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_11 }}
          DRIVER_AUDIT_SOURCE_BUNDLE_12: ${{ secrets.DRIVER_AUDIT_SOURCE_BUNDLE_12 }}
          DRIVER_AUDIT_SOURCE_ENVIRONMENT_B64: ${{ secrets.DRIVER_AUDIT_SOURCE_ENVIRONMENT_B64 }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { createHash, randomUUID } from 'node:crypto';
          const chunks = Array.from({length: 12}, (_, i) => process.env['DRIVER_AUDIT_SOURCE_BUNDLE_' + String(i + 1).padStart(2, '0')] || '');
          if (!chunks.every(x => x.length <= 48 * 1024 && /^[A-Za-z0-9+/=]*$/.test(x))) throw Error('Invalid source transfer chunks');
          const encoded = chunks.join('');
          const bundle = Buffer.from(encoded, 'base64');
          if (!encoded || bundle.toString('base64') !== encoded || createHash('sha256').update(bundle).digest('hex') !== process.env.SOURCE_BUNDLE_SHA) throw Error('Source transfer integrity failure');
          const envEncoded = process.env.DRIVER_AUDIT_SOURCE_ENVIRONMENT_B64 || '';
          const environment = Buffer.from(envEncoded, 'base64');
          if (!envEncoded || envEncoded.length > 48 * 1024 || environment.toString('base64') !== envEncoded) throw Error('Invalid source environment transfer');
          JSON.parse(environment);
          const token = randomUUID();
          const dir = '.source-transfer-' + token;
          await fs.mkdir(dir, {mode: 0o700});
          await fs.writeFile(dir + '/bundle.private.gz', bundle, {mode: 0o600});
          await fs.writeFile(dir + '/environment.private.json', environment, {mode: 0o600});
          await fs.appendFile(process.env.GITHUB_OUTPUT, 'token=' + token + '\ndirectory=' + dir + '\n');
          NODE

      - name: Prepare private host transfer directory
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-source-stage'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          SOURCE_STAGE_TOKEN: ${{ steps.source-transfer.outputs.token }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          envs: DO_APP_PATH,SOURCE_STAGE_TOKEN
          script: |
            set -e
            cd -- "$DO_APP_PATH"
            node --input-type=module <<'NODE'
            import fs from 'node:fs/promises';
            import path from 'node:path';
            const token = process.env.SOURCE_STAGE_TOKEN;
            if (!/^[a-f0-9-]{36}$/.test(token || '')) throw Error('Invalid source transfer identity');
            let root = path.resolve('server');
            for (const name of ['.private', 'driver-audit-source', 'incoming', token]) {
              root = path.join(root, name);
              await fs.mkdir(root, {mode: 0o700}).catch(e => {if (e.code !== 'EEXIST') throw e});
              const stat = await fs.lstat(root);
              if (!stat.isDirectory() || stat.mode & 0o077 || stat.uid !== process.getuid() || await fs.realpath(root) !== root) throw Error('Private source transfer directory is unsafe');
            }
            NODE

      - name: Transfer private source files
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-source-stage'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          version: '1.8.0'
          source: '${{ steps.source-transfer.outputs.directory }}/bundle.private.gz,${{ steps.source-transfer.outputs.directory }}/environment.private.json'
          target: '${{ secrets.DO_APP_PATH }}/server/.private/driver-audit-source/incoming/${{ steps.source-transfer.outputs.token }}'
          tar_tmp_path: '${{ secrets.DO_APP_PATH }}/server/.private/driver-audit-source/incoming/${{ steps.source-transfer.outputs.token }}/'
          strip_components: 1

      - name: Run reviewed driver audit operation
        if: github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy' && inputs.operation != 'deploy-supabase-reader' && inputs.operation != 'check-supabase-reader'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          AUDIT_OPERATION: ${{ inputs.operation }}
          DRIVER_AUDIT_BUILDER_FROM: ${{ inputs.audit_builder_from }}
          DRIVER_AUDIT_BUILDER_TO: ${{ inputs.audit_builder_to }}
          DRIVER_AUDIT_DEPLOY_SHA: ${{ inputs.expected_sha }}
          DRIVER_AUDIT_DEPLOY_MANIFEST: ${{ inputs.audit_manifest_sha256 }}
          DRIVER_AUDIT_DEPLOY_CAPACITY_BYTES: ${{ inputs.audit_capacity_bytes }}
          DRIVER_AUDIT_DEPLOY_SECRET: ${{ inputs.operation != 'audit-rollback' && secrets.DRIVER_AUDIT_SUPABASE_SECRET || '' }}
          DRIVER_AUDIT_STAFF_GENERATION: ${{ inputs.staff_verified_generation }}
          DRIVER_AUDIT_STAFF_VERIFICATION: ${{ inputs.staff_verification_reference }}
          DRIVER_AUDIT_GC_RESTORE_RECEIPT_SHA256: ${{ inputs.audit_gc_restore_receipt_sha256 }}
          DRIVER_AUDIT_RETAINED_GENERATIONS: ${{ inputs.audit_retained_generations }}
          DRIVER_AUDIT_SYNC_MIN_MEMORY: ${{ inputs.sync_min_free_memory_bytes }}
          DRIVER_AUDIT_SYNC_MIN_DISK: ${{ inputs.sync_min_free_disk_bytes }}
          DRIVER_AUDIT_SOURCE_MANIFEST: ${{ inputs.audit_source_manifest_sha256 }}
          DRIVER_AUDIT_SOURCE_RELEASE_FILE: ${{ inputs.audit_source_release_file }}
          DRIVER_AUDIT_SOURCE_RELEASE_SHA256: ${{ inputs.audit_source_release_sha256 }}
          DRIVER_AUDIT_SOURCE_NODE: ${{ inputs.source_node_executable }}
          DRIVER_AUDIT_SOURCE_BUNDLE_SHA256: ${{ inputs.audit_source_bundle_sha256 }}
          DRIVER_AUDIT_SOURCE_STAGE_TOKEN: ${{ steps.source-transfer.outputs.token }}
          DRIVER_AUDIT_SOURCE_PROOF_SHA256: ${{ inputs.audit_source_proof_sha256 }}
          DRIVER_AUDIT_SOURCE_QUALIFICATION_SHA256: ${{ inputs.audit_source_qualification_sha256 }}
          DRIVER_AUDIT_SOURCE_PROOF_B64: ${{ inputs.operation == 'audit-source-proof-stage' && secrets.DRIVER_AUDIT_SOURCE_PROOF_B64 || '' }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          command_timeout: ${{ inputs.operation == 'audit-source-qualify' && '55m' || '20m' }}
          envs: DO_APP_PATH,AUDIT_OPERATION,DRIVER_AUDIT_BUILDER_FROM,DRIVER_AUDIT_BUILDER_TO,DRIVER_AUDIT_DEPLOY_SHA,DRIVER_AUDIT_DEPLOY_MANIFEST,DRIVER_AUDIT_DEPLOY_CAPACITY_BYTES,DRIVER_AUDIT_DEPLOY_SECRET,DRIVER_AUDIT_STAFF_GENERATION,DRIVER_AUDIT_STAFF_VERIFICATION,DRIVER_AUDIT_GC_RESTORE_RECEIPT_SHA256,DRIVER_AUDIT_RETAINED_GENERATIONS,DRIVER_AUDIT_SYNC_MIN_MEMORY,DRIVER_AUDIT_SYNC_MIN_DISK,DRIVER_AUDIT_SOURCE_MANIFEST,DRIVER_AUDIT_SOURCE_RELEASE_FILE,DRIVER_AUDIT_SOURCE_RELEASE_SHA256,DRIVER_AUDIT_SOURCE_NODE,DRIVER_AUDIT_SOURCE_BUNDLE_SHA256,DRIVER_AUDIT_SOURCE_STAGE_TOKEN,DRIVER_AUDIT_SOURCE_PROOF_SHA256,DRIVER_AUDIT_SOURCE_PROOF_B64,DRIVER_AUDIT_SOURCE_QUALIFICATION_SHA256
          script: |
            set -e
            cd -- "$DO_APP_PATH"
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            if [ "$(git rev-parse origin/main)" != "$DRIVER_AUDIT_DEPLOY_SHA" ] || [ "$(git rev-parse HEAD)" != "$DRIVER_AUDIT_DEPLOY_SHA" ]; then
              echo "Deploy the exact reviewed current commit before running this audit operation."
              exit 1
            fi
            case "$AUDIT_OPERATION" in
              audit-source-*) node server/scripts/driverAuditSourceDeploy.js "$AUDIT_OPERATION" ;;
              *) node server/scripts/driverAuditDeploy.js "$AUDIT_OPERATION" ;;
            esac

      - name: Remove runner source transfer files
        if: always() && steps.source-transfer.outputs.directory != ''
        shell: bash
        env:
          SOURCE_TRANSFER_DIR: ${{ steps.source-transfer.outputs.directory }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const dir = process.env.SOURCE_TRANSFER_DIR;
          if (!/^\.source-transfer-[a-f0-9-]{36}$/.test(dir || '')) throw Error('Invalid cleanup path');
          await fs.rm(dir, {recursive: true, force: true});
          NODE

  reporting-preview:
    if: >-
      github.repository == 'sidimohameddaliali2-crypto/matter-admin-app' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["reporting-readiness","reporting-preview-stage","reporting-preview-enable","reporting-preview-disable"]'), inputs.operation)
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the reviewed operator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select the exact reporting operation
        id: reporting-operator
        shell: bash
        env:
          REPORTING_OPERATION: ${{ inputs.operation }}
          REPORTING_DEPLOYED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$REPORTING_OPERATION" in
            reporting-readiness) mode=inspect ;;
            reporting-preview-stage) mode=stage ;;
            reporting-preview-enable) mode=enable ;;
            reporting-preview-disable) mode=disable ;;
            *) echo "Invalid reporting operation."; exit 1 ;;
          esac
          if [[ ! "$REPORTING_DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Select the exact deployed app commit from the reviewed main workflow."
            exit 1
          fi
          operator=server/scripts/reporting-source-operator.mjs
          if [[ "$(wc -c < "$operator")" -gt 49152 ]]; then
            echo "The reporting operator exceeds its transfer limit."
            exit 1
          fi
          node --check "$operator"
          checksum=$(sha256sum "$operator")
          printf 'mode=%s\ncode=%s\nsha256=%s\n' "$mode" "$(base64 -w0 "$operator")" "${checksum%% *}" >> "$GITHUB_OUTPUT"

      - name: Configure only Preview delivery reporting
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DO_APP_PATH: ${{ secrets.DO_APP_PATH }}
          REPORTING_WORKFLOW_SHA: ${{ github.sha }}
          REPORTING_DEPLOYED_SHA: ${{ inputs.expected_sha }}
          REPORTING_OPERATOR_MODE: ${{ steps.reporting-operator.outputs.mode }}
          REPORTING_OPERATOR_CODE: ${{ steps.reporting-operator.outputs.code }}
          REPORTING_OPERATOR_SHA256: ${{ steps.reporting-operator.outputs.sha256 }}
          MATTER_REPORTING_WEBHOOK_SECRET: ${{ inputs.operation == 'reporting-preview-enable' && secrets.MATTER_REPORTING_WEBHOOK_SECRET || '' }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          command_timeout: 6m
          envs: ${{ inputs.operation == 'reporting-preview-enable' && 'DO_APP_PATH,REPORTING_WORKFLOW_SHA,REPORTING_DEPLOYED_SHA,REPORTING_OPERATOR_MODE,REPORTING_OPERATOR_CODE,REPORTING_OPERATOR_SHA256,MATTER_REPORTING_WEBHOOK_SECRET' || 'DO_APP_PATH,REPORTING_WORKFLOW_SHA,REPORTING_DEPLOYED_SHA,REPORTING_OPERATOR_MODE,REPORTING_OPERATOR_CODE,REPORTING_OPERATOR_SHA256' }}
          script: |
            set -eu
            cd -- "$DO_APP_PATH"
            if [ "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" != "$REPORTING_WORKFLOW_SHA" ] ||
              [ "$(git --no-replace-objects rev-parse HEAD)" != "$REPORTING_DEPLOYED_SHA" ] ||
              ! git --no-replace-objects diff --quiet HEAD -- server; then
              echo "The main workflow or deployed server checkout differs from the selected commit."
              exit 1
            fi
            umask 077
            operator=$(mktemp --suffix=.mjs server/scripts/.reporting-preview-op.XXXXXXXX)
            trap 'rm -f -- "$operator"' EXIT
            printf '%s' "$REPORTING_OPERATOR_CODE" | base64 --decode > "$operator"
            checksum=$(sha256sum "$operator")
            if [ "${checksum%% *}" != "$REPORTING_OPERATOR_SHA256" ]; then
              echo "The reporting operator checksum did not match."
              exit 1
            fi
            unset REPORTING_OPERATOR_CODE
            node "$operator" "$REPORTING_OPERATOR_MODE" "$REPORTING_DEPLOYED_SHA"
