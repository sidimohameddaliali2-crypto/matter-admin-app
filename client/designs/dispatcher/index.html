function dispatchView(){return `<div class="heading"><div><div class="eyebrow">YOUR DAILY OPERATIONS</div><h1>Every route. Ready to go.</h1><p>Plan deliveries, prepare your drivers, and account for every bag.</p></div><div class="headingactions"><button data-info="New delivery">${icon('plus')}New delivery</button><button class="primary" data-start>${icon('swap')}Bag handover</button></div></div><div class="toolbar"><button data-collections class="${deliveryFilter==='collection'?'primary':''}" aria-pressed="${deliveryFilter==='collection'}">${icon('box')}Collections</button><button data-info="Scheduled events">${icon('calendar')}Events</button></div><div class="split"><section class="panel"><div class="paneltitle"><div><div class="eyebrow">THE DELIVERY BOARD</div><h2>Today’s deliveries <span class="count">${deliveries.length}</span></h2></div><button data-tomorrow>${icon('calendar')}Tomorrow</button></div>${dispatchFilters()}<div class="filters"><button data-unassigned class="${deliveryFilter==='pending'?'primary':''}" aria-pressed="${deliveryFilter==='pending'}">${icon('user')}Unassigned</button></div><div id="deliveryRows"></div><div class="tablefoot"><span>Sample schedule · Dubai time</span><span>Open a delivery to preview its details</span></div></section><aside><section class="feature">${icon('swap')}<div><div class="eyebrow">DISPATCHER → DRIVER</div><h2>Every bag.<br>Signed over.</h2><p>A separate handover flow. Your name, the receiving driver, and the exact bag count stay on the record.</p></div><button class="primary" data-start>Start bag handover ${icon('arrow')}</button></section><section class="sidecard"><h3>Drivers on this schedule</h3>${drivers.map(d=>`<div class="driverline"><span class="avatar">${d.initials}</span><div>${d.name}<small>${d.area}</small></div><b>${deliveries.filter(x=>x.driver===d.id).length}</b></div>`).join('')}<button data-nav="drivers">View all drivers ${icon('arrow')}</button></section></aside></div>`;}

function dispatchFilters(){return `<div class="filters dispatch-filters"><label class="search">${icon('search')}<input id="deliverySearch" aria-label="Search deliveries" placeholder="Customer, ID, address, or zone…" value="${esc(deliverySearch)}"></label><label class="dispatch-select">Zone<select id="zoneFilter" aria-label="Filter by zone"><option value="all">All zones</option>${[...new Set(deliveries.map(d=>d.area))].map(zone=>`<option value="${esc(zone)}" ${zoneFilter===zone?'selected':''}>${zone}</option>`).join('')}</select></label><label class="dispatch-select">Driver<select id="driverFilter" aria-label="Filter by driver"><option value="all">All drivers</option><option value="unassigned" ${driverFilter==='unassigned'?'selected':''}>Unassigned</option>${drivers.map(d=>`<option value="${d.id}" ${driverFilter===d.id?'selected':''}>${d.name}</option>`).join('')}</select></label></div>`;}
function sampleLocation(delivery){const index=deliveries.indexOf(delivery)+1;const point={'Dubai Marina':[25.0803,55.1403],JVC:[25.0584,55.2050],'Business Bay':[25.1850,55.2630]}[delivery.area];return {address:`Sample Building ${String(index).padStart(2,'0')}, Apartment ${100+index}, ${delivery.area}, Dubai`,note:'Sample access note: use the main reception entrance.',pin:delivery.id==='D-1045'?null:point};}
function deliveryRows(){const rows=deliveries.filter(d=>(deliveryFilter==='all'||(deliveryFilter==='collection'?d.type==='Collection':deliveryFilter==='pending'?!d.driver:d.state===deliveryFilter))&&(zoneFilter==='all'||d.area===zoneFilter)&&(driverFilter==='all'||(driverFilter==='unassigned'?!d.driver:d.driver===driverFilter))&&`${d.id} ${d.name} ${d.area} ${sampleLocation(d).address}`.toLowerCase().includes(deliverySearch.toLowerCase()));return `${deliverySelection.size?`<div class="selectedbar"><span>${deliverySelection.size} deliveries selected</span><button class="primary" data-info="Driver assignment">Preview assignment ${icon('arrow')}</button></div>`:''}<div class="tablewrap"><table><thead><tr><th><input id="selectAllDeliveries" type="checkbox" aria-label="Select visible deliveries" ${rows.length&&rows.every(d=>deliverySelection.has(d.id))?'checked':''}></th><th>Customer / delivery</th><th>Area & window</th><th>Driver</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(d=>`<tr><td><input type="checkbox" data-select="${d.id}" aria-label="Select ${d.id}" ${deliverySelection.has(d.id)?'checked':''}></td><td><strong>${d.name}</strong><small>${d.id} · ${d.type}</small></td><td>${d.area}<small>${d.time}</small></td><td>${driverName(d.driver)}</td><td>${pill(d.state,d.state==='pending'?'Unassigned':undefined)}</td><td><button class="linkbutton" data-delivery="${d.id}" aria-label="Open ${d.id}">${icon('up')}</button></td></tr>`).join('')}</tbody></table></div><div class="mobilecards">${rows.map(d=>`<article class="deliverycard"><div class="cardhead"><input type="checkbox" data-select="${d.id}" aria-label="Select ${d.id}" ${deliverySelection.has(d.id)?'checked':''}><strong>${d.name}</strong>${pill(d.state,d.state==='pending'?'Unassigned':undefined)}</div><div class="cardinfo"><span>${icon('pin')}${d.area}</span><span>${icon('clock')}${d.time}</span></div><div class="cardbottom"><span>${d.id} · ${driverName(d.driver)}</span><button data-delivery="${d.id}">Details ${icon('up')}</button></div></article>`).join('')}</div>${!rows.length?'<div class="empty">No sample deliveries match this view.</div>':''}`;}

function driversView(){return `<div class="heading"><div><div class="eyebrow">PREPARE THE TEAM</div><h1>Drivers & their runs.</h1><p>Bring delivery planning and bag handovers into one daily view.</p></div><div class="headingactions"><button class="primary" data-start>${icon('swap')}Bag handover</button></div></div><div class="cardgrid">${drivers.map(d=>`<article class="drivercard"><span class="avatar">${d.initials}</span><h3>${d.name}</h3><p>${d.area}</p><div class="summaryrow"><span>Assigned deliveries</span><b>${deliveries.filter(x=>x.driver===d.id).length}</b></div><div class="summaryrow"><span>Bags accepted today</span><b>${history.filter(h=>h.driver===d.id&&h.status==='accepted').reduce((s,h)=>s+h.bags.length,0)}</b></div><div class="summaryrow"><span>Awaiting acceptance</span><b>${history.filter(h=>h.driver===d.id&&h.status==='pending').reduce((s,h)=>s+h.bags.length,0)}</b></div><button class="primary" data-driver-start="${d.id}">Prepare bag handover ${icon('arrow')}</button><button data-info="${d.name} · Route view">Preview route ${icon('route')}</button></article>`).join('')}</div>`;}
function handoverView(){return `<a class="backlink" href="#dispatch" data-nav="dispatch">${icon('back')}Back to dispatcher</a><div class="heading"><div><div class="eyebrow">A SEPARATE HANDOVER FLOW</div><h1>Bag handover.</h1><p>Every bag traced to the dispatcher who hands it over.</p></div><div class="headingactions"><button data-nav="history">${icon('clock')}Handover history</button></div></div><div class="auditstrip">${icon('shield')}<div><strong>Handed over by ${actor}</strong><p>Recorded from the signed-in dispatcher. The bag count comes from the selected IDs.</p></div><span class="lock">Accountable dispatcher</span></div><div class="flowlayout"><section class="panel flowpanel">${step!==4?`<div class="steps">${['Receiving driver','Check bags','Review'].map((t,i)=>`<div class="step ${step===i+1?'active':step>i+1?'done':''}"><span>${step>i+1?icon('check'):i+1}</span>${t}</div>`).join('')}</div>`:''}${step===1?driverStep():step===2?bagStep():step===3?reviewStep():completeStep()}</section><aside class="summarypanel"><div><div class="eyebrow">HANDOVER SUMMARY</div><h3>${chosenDriver?driverName(chosenDriver):'Choose a receiving driver'}</h3></div><div class="summaryrow"><span>Dispatcher</span><b>Omar</b></div><div class="summaryrow"><span>Receiving driver</span><b>${chosenDriver?driverName(chosenDriver):'Not selected'}</b></div><div class="summarynumber"><strong>${chosenBags.size}</strong>bags in this handover</div><div class="summarycodes">${[...chosenBags].map(id=>`<span>${id}</span>`).join('')}</div><div class="info">Prepared bags remain in warehouse custody until the receiving driver accepts. The final receipt will keep both confirmations.</div></aside></div>`;}
function recipientOptions(){const matches=drivers.filter(d=>(d.name+' '+d.area).toLowerCase().includes(recipientSearch.trim().toLowerCase()));const visible=matches.slice(0,4);return `<div class="recipient-hint">Showing ${visible.length} of ${matches.length} matching drivers · up to 4 at a time</div>${visible.map(d=>`<label class="driveroption"><input type="radio" name="driver" value="${d.id}" ${chosenDriver===d.id?'checked':''}><div><strong>${d.name}</strong><small>${d.area}</small></div><span>Sample driver</span></label>`).join('')}${!matches.length?'<div class="empty">No drivers match. Try another name or area.</div>':''}${chosenDriver?`<p class="recipient-selected">${icon('check')}Selected: ${driverName(chosenDriver)}</p>`:''}`;}

function bagStep(){const blocked=new Set(history.flatMap(h=>h.bags));return `<h2>Check every bag.</h2><p>Select the exact ready tags you checked, or try the sample scan. The quantity is calculated automatically.</p><form class="scanform" id="scanForm"><input id="scanInput" aria-label="Scan or enter sample bag label" placeholder="BAG-0101" autoCapitalize="characters" autocomplete="off" maxlength="20"><button type="submit" aria-label="Add scanned bag">${icon('plus')}</button></form><button class="linkbutton" id="sampleScan">${icon('scan')}Try a sample scan</button>${flowError?`<div class="smallerror" role="alert">${esc(flowError)}</div>`:''}<div>${inventory.map(b=>{const available=b.state==='Ready'&&!blocked.has(b.id);return `<label class="bagoption ${available?'':'disabled'}"><input type="checkbox" data-bag="${b.id}" ${chosenBags.has(b.id)?'checked':''} ${available?'':'disabled'}><span>${b.id}</span>${pill(available?'accepted':'',blocked.has(b.id)?'Already prepared':b.state)}</label>`;}).join('')}</div><div class="flowbuttons"><button id="backDriver">${icon('back')}Back</button><button class="primary" id="toReview" ${chosenBags.size?'':'disabled'}>Review ${chosenBags.size||''} bag${chosenBags.size===1?'':'s'} ${icon('arrow')}</button></div>`;}
function reviewStep(){return `<h2>Count it. Check it. Sign it.</h2><p>The dispatcher stays accountable for these bag IDs. The driver’s acceptance is recorded separately.</p><div class="reviewgrid"><div><small>Handed over by</small><strong>Omar · Dispatcher</strong></div><div><small>Receiving driver</small><strong>${driverName(chosenDriver)}</strong></div><div><small>Exact quantity</small><strong class="quantity">${chosenBags.size}</strong></div><div><small>Next status</small>${pill('pending','Awaiting driver acceptance')}</div></div><div class="summarycodes" style="margin-top:18px">${[...chosenBags].map(id=>`<span>${id}</span>`).join('')}</div><label class="field">Handover note <span class="muted">(optional)</span><textarea id="handoverNote" placeholder="Add a physical check or handover note" maxlength="500">${esc(note)}</textarea></label><label class="checkline"><input id="physicalCheck" type="checkbox" ${checked?'checked':''}>I physically checked all ${chosenBags.size} bags and confirm the receiving driver is ${driverName(chosenDriver)}.</label><div class="info">Design preview: this creates a sample receipt only. No live bag state, custody, or dispatch record will change.</div><div class="flowbuttons"><button id="backBags">${icon('back')}Back</button><button class="primary" id="previewConfirm" ${checked?'':'disabled'}>Preview handover record ${icon('check')}</button></div>`;}
function completeStep(){return `<div class="successicon">${icon('check')}</div><div class="eyebrow">SAMPLE RECEIPT · ${newRecord.id}</div><h2>${newRecord.bags.length} bags prepared.</h2><p>Your dispatcher confirmation is on the sample history record. ${driverName(newRecord.driver)} still needs to accept the bags.</p><div class="receiptline">${icon('check')}<div><strong>Dispatcher confirmed · Omar</strong><p>${newRecord.bags.length} exact bag IDs · ${newRecord.time}</p></div></div><div class="receiptline wait">${icon('clock')}<div><strong>Awaiting receiving driver</strong><p>No accepted handover quantity is counted yet. Warehouse custody is retained until acceptance.</p></div></div><div class="flowbuttons"><button id="anotherHandover">New handover</button><button class="primary" data-nav="history">View history ${icon('arrow')}</button></div>`;}
function historyView(){const accepted=history.filter(h=>h.status==='accepted').reduce((s,h)=>s+h.bags.length,0),pending=history.filter(h=>h.status==='pending').reduce((s,h)=>s+h.bags.length,0);return `<div class="heading"><div><div class="eyebrow">DISPATCHER ACCOUNTABILITY</div><h1>Every handover has a name.</h1><p>Who handed it over, who received it, and exactly how many bags.</p></div><div class="headingactions"><button class="primary" data-start>${icon('swap')}New handover</button></div></div><div class="stats">${stat('Bags handed over',accepted,'Accepted by receiving drivers','lime','check')}${stat('Awaiting acceptance',pending,'Prepared, not yet handed over','','clock')}${stat('Handover records',history.length,'Dispatcher confirmations today','','swap')}${stat('Accountable dispatcher','Omar','Every sample record carries this actor','','user')}</div><div class="historytop"><div class="tabs" aria-label="Handover status">${[['all','All records'],['accepted','Driver accepted'],['pending','Awaiting acceptance']].map(([key,label])=>`<button data-history-filter="${key}" class="${historyFilter===key?'active':''}">${label}</button>`).join('')}</div></div><section class="panel"><div class="paneltitle"><div><div class="eyebrow">26 OCTOBER 2026 · DUBAI</div><h2>Handover history</h2></div></div><div class="filters"><label class="search">${icon('search')}<input id="historySearch" aria-label="Search handover history" placeholder="Receipt, driver, dispatcher, or bag ID…" value="${esc(historySearch)}"></label></div><div id="historyRows"></div><div class="tablefoot"><span>Sample records only · quantity always derives from the bag IDs</span><span>Open a receipt for its complete audit trail</span></div></section>`;}
function historyRows(){const rows=[...history].reverse().filter(h=>(historyFilter==='all'||h.status===historyFilter)&&`${h.id} ${driverName(h.driver)} ${actor} ${h.bags.join(' ')}`.toLowerCase().includes(historySearch.toLowerCase()));return `<div class="tablewrap"><table class="historytable"><thead><tr><th>Receipt / time</th><th>Handed over by</th><th>Receiving driver</th><th>Prepared</th><th>Accepted</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(h=>`<tr data-receipt="${h.id}"><td><strong>${h.id}</strong><small>${h.time}</small></td><td><strong>Omar</strong><small>Dispatcher · accountable actor</small></td><td>${driverName(h.driver)}</td><td>${h.bags.length} bags</td><td><strong>${h.status==='accepted'?h.bags.length:0} bags</strong></td><td>${pill(h.status)}</td><td><button class="linkbutton" data-receipt="${h.id}" aria-label="View ${h.id}">${icon('up')}</button></td></tr>`).join('')}</tbody></table></div><div class="mobilecards">${rows.map(h=>`<article class="historycard"><div class="cardhead"><strong>${h.id}</strong>${pill(h.status)}</div><p><b>Omar · Dispatcher</b> → ${driverName(h.driver)}<br>${h.time}</p><div class="cardbottom"><span><strong>${h.bags.length}</strong> prepared · <strong>${h.status==='accepted'?h.bags.length:0}</strong> accepted</span><button class="linkbutton" data-receipt="${h.id}" aria-label="View ${h.id}">${icon('up')}</button></div></article>`).join('')}</div>${rows.length?'':'<div class="empty">No sample receipts match this view.</div>'}`;}
function updateHistoryRows(){document.getElementById('historyRows').innerHTML=historyRows();bindRows();}
function receipt(id){const h=history.find(h=>h.id===id);showDialog(`<div class="eyebrow">HANDOVER RECEIPT / SAMPLE</div><h2 id="dialogtitle">${h.id} · ${h.bags.length} bags</h2>${pill(h.status)}<div class="summaryrow"><span>Handed over by</span><b>Omar · Dispatcher</b></div><div class="summaryrow"><span>Receiving driver</span><b>${driverName(h.driver)}</b></div><div class="summaryrow"><span>Prepared quantity</span><b>${h.bags.length} bags</b></div><div class="summaryrow"><span>Accepted handover quantity</span><b>${h.status==='accepted'?h.bags.length:0} bags</b></div><div class="summarycodes">${h.bags.map(id=>`<span>${id}</span>`).join('')}</div><div class="receiptline">${icon('check')}<div><strong>Dispatcher confirmed · Omar</strong><p>${h.time}</p></div></div><div class="receiptline ${h.status==='accepted'?'':'wait'}">${icon(h.status==='accepted'?'check':'clock')}<div><strong>${h.status==='accepted'?`Driver accepted · ${driverName(h.driver)}`:'Awaiting driver acceptance'}</strong><p>${h.accepted||'No accepted quantity counted yet.'}</p></div></div><p>${esc(h.note||'No handover note.')}</p><div class="info">This is a design sample. The operational system has not been changed.</div>`);}
function showDialog(html){previousFocus=document.activeElement;document.getElementById('dialog').innerHTML=`<button class="close" id="closeDialog" aria-label="Close dialog">${icon('close')}</button>`+html;document.getElementById('scrim').hidden=false;document.body.style.overflow='hidden';document.getElementById('closeDialog').onclick=closeDialog;document.getElementById('closeDialog').focus();}

function deliveryDetail(id){const d=deliveries.find(d=>d.id===id),location=sampleLocation(d);showDialog(`<div class="eyebrow">${d.id} · SAMPLE DELIVERY</div><h2 id="dialogtitle">${d.name}</h2>${pill(d.state,d.state==='pending'?'Unassigned':undefined)}<div class="summaryrow"><span>Zone</span><b>${d.area}</b></div><div class="summaryrow"><span>Delivery window · Dubai</span><b>${d.time}</b></div><div class="summaryrow"><span>Driver</span><b>${driverName(d.driver)}</b></div><section class="delivery-location" aria-label="Delivery location"><h3>${icon('pin')}Delivery location</h3><p>${esc(location.address)}</p><small>${esc(location.note)}</small></section><section class="delivery-pin" aria-label="Saved pin location"><h3>Saved pin location</h3>${location.pin?`<div class="pin-preview">${icon('pin')}<strong>Saved delivery pin</strong><span>Map preview · design only</span></div><div class="pin-coordinates"><div><small>Latitude</small><strong>${location.pin[0].toFixed(6)}</strong></div><div><small>Longitude</small><strong>${location.pin[1].toFixed(6)}</strong></div></div><p>Illustrative coordinates only. The live map is not connected in this preview.</p>`:'<div class="pin-missing">No saved pin for this sample delivery.</div><p>Request an exact pin before routing. No location is guessed from the address.</p>'}</section>`);}
function bindRows(){document.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>{el.checked?deliverySelection.add(el.dataset.select):deliverySelection.delete(el.dataset.select);updateDeliveryRows();});const all=document.getElementById('selectAllDeliveries');if(all)all.onchange=()=>{document.querySelectorAll('[data-select]').forEach(el=>all.checked?deliverySelection.add(el.dataset.select):deliverySelection.delete(el.dataset.select));updateDeliveryRows();};document.querySelectorAll('[data-delivery]').forEach(el=>el.onclick=()=>deliveryDetail(el.dataset.delivery));document.querySelectorAll('[data-receipt]').forEach(el=>el.onclick=e=>{e.stopPropagation();receipt(el.dataset.receipt);});document.querySelectorAll('[data-info]').forEach(el=>el.onclick=()=>info(el.dataset.info));}
function bind(){
 document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=e=>{e.preventDefault();navigate(el.dataset.nav);});document.querySelectorAll('[data-start]').forEach(el=>el.onclick=startHandover);document.querySelectorAll('[data-info]').forEach(el=>el.onclick=()=>info(el.dataset.info));document.querySelectorAll('[data-driver-start]').forEach(el=>el.onclick=()=>{startHandover();chosenDriver=el.dataset.driverStart;step=2;render();});
 if(view==='dispatch'){updateDeliveryRows();document.getElementById('deliverySearch').oninput=e=>{deliverySearch=e.target.value;updateDeliveryRows();};document.getElementById('zoneFilter').onchange=e=>{zoneFilter=e.target.value;updateDeliveryRows();};document.getElementById('driverFilter').onchange=e=>{driverFilter=e.target.value;updateDeliveryRows();};document.querySelector('[data-unassigned]').onclick=()=>{deliveryFilter=deliveryFilter==='pending'?'all':'pending';render();};document.querySelector('[data-collections]').onclick=()=>{deliveryFilter=deliveryFilter==='collection'?'all':'collection';render();};document.querySelector('[data-tomorrow]').onclick=()=>{previewDate='2026-10-27';render();toast('Tomorrow selected. Sample schedule only.');};}
 if(view==='history'){updateHistoryRows();document.getElementById('historySearch').oninput=e=>{historySearch=e.target.value;updateHistoryRows();};document.querySelectorAll('[data-history-filter]').forEach(el=>el.onclick=()=>{historyFilter=el.dataset.historyFilter;render();});}
 if(view==='handover'){
  if(step===1){bindRecipientChoices();document.getElementById('recipientSearch').oninput=e=>{recipientSearch=e.target.value;document.getElementById('recipientResults').innerHTML=recipientOptions();bindRecipientChoices();};document.getElementById('toBags').onclick=()=>{if(chosenDriver){step=2;render();window.scrollTo(0,0);}};}

  if(step===3){document.getElementById('handoverNote').oninput=e=>note=e.target.value;document.getElementById('physicalCheck').onchange=e=>{checked=e.target.checked;document.getElementById('previewConfirm').disabled=!checked;};document.getElementById('backBags').onclick=()=>{step=2;render();};document.getElementById('previewConfirm').onclick=()=>{if(!checked||!chosenDriver||!chosenBags.size)return;newRecord={id:`HO-${String(26+history.length-3).padStart(4,'0')}`,driver:chosenDriver,bags:[...chosenBags],status:'pending',time:'26 Oct · 06:25 (sample)',accepted:'',note};history.push(newRecord);step=4;render();window.scrollTo(0,0);};}
  if(step===4)document.getElementById('anotherHandover').onclick=startHandover;
 }
}
function addScan(raw){const id=String(raw).trim().toUpperCase();const bag=inventory.find(b=>b.id===id);const alreadyPrepared=history.some(h=>h.bags.includes(id));if(!bag||bag.state!=='Ready'||alreadyPrepared)flowError='This sample label is unavailable for handover. Choose a ready bag from the list.';else if(chosenBags.has(id))flowError=`${id} is already selected. It will count once.`;else{chosenBags.add(id);checked=false;flowError='';}render();}
document.getElementById('scrim').onclick=e=>{if(e.target===e.currentTarget)closeDialog();};document.addEventListener('keydown',e=>{if(document.getElementById('scrim').hidden)return;if(e.key==='Escape')closeDialog();if(e.key==='Tab'){const items=[...document.getElementById('dialog').querySelectorAll('button,a,input,select,textarea')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0]?.focus();}}});
window.addEventListener('hashchange',()=>{const to=location.hash.slice(1);if(['dispatch','drivers','handover','history'].includes(to)&&view!==to){view=to;render();window.scrollTo(0,0);}});
if(['dispatch','drivers','handover','history'].includes(location.hash.slice(1)))view=location.hash.slice(1);render();
